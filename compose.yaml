# ПрактикаПлюс — all local components with one command:
#   cp .env.example .env && docker compose up --build
# Ports: 8001 API · 8002 cabinet (HR/curator) · 8003 mini app · 8004 landing.
# The defaults below are for a local run; production overrides them in .env.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praktikaplus}
      POSTGRES_USER: ${POSTGRES_USER:-praktikaplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praktikaplus}
    volumes:
      - praktikaplus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praktikaplus} -d ${POSTGRES_DB:-praktikaplus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      ENV: ${ENV:-dev}
      SANDBOX_LOGIN: ${SANDBOX_LOGIN:-true}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-true}
      TERMS_VERSION: ${TERMS_VERSION:-2026-09-23}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-09-23}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8001}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-praktikaplus}:${POSTGRES_PASSWORD:-praktikaplus}@db:5432/${POSTGRES_DB:-praktikaplus}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t417_hakaton_max_bot}
      MAX_MINIAPP_URL: ${MAX_MINIAPP_URL:-http://localhost:8003}
      LK_PUBLIC_URL: ${LK_PUBLIC_URL:-http://localhost:8002}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-60}
      DECISION_GRACE_SECONDS: ${DECISION_GRACE_SECONDS:-90}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8002,http://localhost:8003,http://localhost:8004}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend-lk:
    build:
      context: ./frontend-lk
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8001}
        VITE_LEGAL_BASE_URL: ${LEGAL_BASE_URL:-http://localhost:8004}
        VITE_MAX_BOT_URL: ${MAX_BOT_LINK_BASE:-https://max.ru/t417_hakaton_max_bot}
    ports:
      - "8002:80"
    restart: unless-stopped
    depends_on:
      - backend

  frontend-pwa:
    build:
      context: ./frontend-pwa
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8001}
        VITE_LEGAL_BASE_URL: ${LEGAL_BASE_URL:-http://localhost:8004}
        VITE_MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t417_hakaton_max_bot}
    ports:
      - "8003:80"
    restart: unless-stopped
    depends_on:
      - backend

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_LK_URL: ${LK_PUBLIC_URL:-http://localhost:8002}
        VITE_BOT_URL: ${BOT_PUBLIC_URL:-https://max.ru/t417_hakaton_max_bot?startapp=app}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_INN: ${LEGAL_OPERATOR_INN:-}
        VITE_LEGAL_OPERATOR_OGRN: ${LEGAL_OPERATOR_OGRN:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_OPERATOR_EMAIL: ${LEGAL_OPERATOR_EMAIL:-}
        VITE_LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
    ports:
      - "8004:80"
    restart: unless-stopped

volumes:
  praktikaplus-db-data:
